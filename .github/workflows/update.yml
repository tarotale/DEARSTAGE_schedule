name: Daily Scraper

on:
  schedule:
    # 毎日 0時, 6時, 12時, 18時（UTC）に実行
    # UTC（世界標準時）で指定するため、日本時間のマイナス9時間で設定します
    - cron: '0 15,21,3,9 * * *'
  workflow_dispatch: # 手動実行ボタンも残しておきます

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v3 から v4 へ変更
      - name: Checkout repository
        uses: actions/checkout@v4

      # v4 から v5 へ変更
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 使用しているバージョン

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4 webdriver-manager google-api-python-client google-auth

      - name: Run Scraper
        run: python scraper.py
        
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update schedule data" || exit 0
          git push
