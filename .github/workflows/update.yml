name: Daily Scraper

on:
  schedule:
    # 毎日 0時, 6時, 12時, 18時（UTC）に実行（日本時間: 9時, 15時, 21時, 3時）
    - cron: '0 15,21,3,9 * * *'
  workflow_dispatch: # 手動実行ボタン

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ★ 追加: Secrets から credentials.json を動的生成するステップ
      - name: Create credentials.json
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDENTIALS" > credentials.json

      # 依存ライブラリのインストール（1つに統合）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4 webdriver-manager google-api-python-client google-auth

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update schedule data" || exit 0
          git push
