<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSPM SCHEDULE - 2026.05</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0a0a0f 0%, #12121e 50%, #0a0a0f 100%);
            --header-gradient: linear-gradient(90deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            --color-chumtoto: #FF6B9D;
            --color-2zicon: #7B61FF;
            --color-sayostay: #00C9A7;
            --color-kyurushite: #FFB800;
            --color-meme: #FF4B6E;
            --text-main: #f0f0f8;
            --text-muted: #7b7b9a;
        }

        body {
            margin: 0;
            font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Header */
        header {
            background: var(--header-gradient);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 20px 24px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .header-top { font-size: 11px; letter-spacing: 4px; color: var(--text-muted); margin-bottom: 4px; }
        .header-title { font-size: 22px; font-weight: 700; letter-spacing: 1px; margin-bottom: 14px; }

        /* Group Filter Buttons */
        .filter-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .filter-btn {
            padding: 4px 12px;
            border-radius: 20px;
            border: 1.5px solid rgba(255,255,255,0.15);
            background: transparent;
            color: #666;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 400;
        }
        .filter-btn.active[data-group="ChumToto"] { border-color: var(--color-chumtoto); background: color-mix(in srgb, var(--color-chumtoto), transparent 85%); color: var(--color-chumtoto); font-weight: 600; }
        .filter-btn.active[data-group="虹コン"] { border-color: var(--color-2zicon); background: color-mix(in srgb, var(--color-2zicon), transparent 85%); color: var(--color-2zicon); font-weight: 600; }
        .filter-btn.active[data-group="さよステ"] { border-color: var(--color-sayostay); background: color-mix(in srgb, var(--color-sayostay), transparent 85%); color: var(--color-sayostay); font-weight: 600; }
        .filter-btn.active[data-group="きゅるして"] { border-color: var(--color-kyurushite); background: color-mix(in srgb, var(--color-kyurushite), transparent 85%); color: var(--color-kyurushite); font-weight: 600; }
        .filter-btn.active[data-group="meme"] { border-color: var(--color-meme); background: color-mix(in srgb, var(--color-meme), transparent 85%); color: var(--color-meme); font-weight: 600; }

        /* Main List Container */
        .content { padding: 16px 16px 40px; max-width: 800px; margin: 0 auto; }

        .date-section { margin-bottom: 24px; }
        .date-header {
            font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #a0a0c0;
            border-left: 3px solid #3a3a5c; padding-left: 10px; margin-bottom: 8px;
        }

        .event-card {
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 8px;
            text-decoration: none;
            display: block;
            transition: transform 0.2s;
        }
        .event-card:hover { transform: translateX(4px); }

        .group-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; margin-bottom: 3px; }
        .event-title { font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 3px; color: #fff; }
        .event-venue { font-size: 11px; color: #888; }

        /* Group-specific Card Styles */
        .card-ChumToto { background: linear-gradient(135deg, rgba(255,107,157,0.1) 0%, rgba(255,255,255,0.02) 100%); border: 1px solid rgba(255,107,157,0.25); border-left: 3px solid var(--color-chumtoto); }
        .card-ChumToto .group-label { color: var(--color-chumtoto); }
        
        .card-虹コン { background: linear-gradient(135deg, rgba(123,97,255,0.1) 0%, rgba(255,255,255,0.02) 100%); border: 1px solid rgba(123,97,255,0.25); border-left: 3px solid var(--color-2zicon); }
        .card-虹コン .group-label { color: var(--color-2zicon); }

        .card-さよステ { background: linear-gradient(135deg, rgba(0,201,167,0.1) 0%, rgba(255,255,255,0.02) 100%); border: 1px solid rgba(0,201,167,0.25); border-left: 3px solid var(--color-sayostay); }
        .card-さよステ .group-label { color: var(--color-sayostay); }

        .card-きゅるして { background: linear-gradient(135deg, rgba(255,184,0,0.1) 0%, rgba(255,255,255,0.02) 100%); border: 1px solid rgba(255,184,0,0.25); border-left: 3px solid var(--color-kyurushite); }
        .card-きゅるして .group-label { color: var(--color-kyurushite); }

        .card-meme { background: linear-gradient(135deg, rgba(255,75,110,0.1) 0%, rgba(255,255,255,0.02) 100%); border: 1px solid rgba(255,75,110,0.25); border-left: 3px solid var(--color-meme); }
        .card-meme .group-label { color: var(--color-meme); }
    </style>
</head>
<body>

<header>
    <div class="header-top">2026年 DSPM統合スケジュール</div>
    <div class="header-title">📅 SCHEDULE</div>
    <div class="filter-group" id="filterGroup">
        <button class="filter-btn active" data-group="ChumToto">チャムトト</button>
        <button class="filter-btn active" data-group="虹コン">虹コン</button>
        <button class="filter-btn active" data-group="さよステ">さよステ</button>
        <button class="filter-btn active" data-group="きゅるして">きゅるして</button>
        <button class="filter-btn active" data-group="meme">ミーム</button>
    </div>
</header>

<div class="content" id="eventList">
    </div>

<script>
    let allEvents = [];
    const activeGroups = new Set(["ChumToto", "虹コン", "さよステ", "きゅるして", "meme"]);

    async function init() {
        try {
            const response = await fetch('./data.json?v=' + new Date().getTime());
            allEvents = await response.json();
            renderEvents();
        } catch (e) {
            console.error("データの読み込みに失敗しました", e);
            document.getElementById('eventList').innerHTML = "イベントが見つかりません。";
        }
    }

    function renderEvents() {
        const listEl = document.getElementById('eventList');
        listEl.innerHTML = "";

        // 日付順にソート
        const sortedEvents = allEvents.filter(ev => {
            return Array.from(activeGroups).some(g => ev.title.includes(g));
        }).sort((a, b) => a.start.localeCompare(b.start));

        // 日付ごとにグループ化
        const grouped = {};
        sortedEvents.forEach(ev => {
            if (!grouped[ev.start]) grouped[ev.start] = [];
            grouped[ev.start].push(ev);
        });

        if (Object.keys(grouped).length === 0) {
            listEl.innerHTML = '<div style="text-align:center; color:#555; margin-top:60px;">表示するイベントがありません</div>';
            return;
        }

        for (const date in grouped) {
            const dateObj = new Date(date);
            const dayNames = ["日", "月", "火", "水", "木", "金", "土"];
            const dateHeader = `${dateObj.getMonth()+1}/${dateObj.getDate()}（${dayNames[dateObj.getDay()]}）`;

            let dateHtml = `<div class="date-section"><div class="date-header">${dateHeader}</div>`;
            
            grouped[date].forEach(ev => {
                let groupKey = "meme";
                if(ev.title.includes("ChumToto")) groupKey = "ChumToto";
                else if(ev.title.includes("虹コン")) groupKey = "虹コン";
                else if(ev.title.includes("さよステ")) groupKey = "さよステ";
                else if(ev.title.includes("きゅるして")) groupKey = "きゅるして";

                const displayTitle = ev.title.replace(/\[.*?\]\s*/, '');

                dateHtml += `
                    <a href="${ev.url}" class="event-card card-${groupKey}" target="_blank">
                        <div class="group-label">${groupKey.toUpperCase()}</div>
                        <div class="event-title">${displayTitle}</div>
                        <div class="event-venue">📍 詳細を確認</div>
                    </a>
                `;
            });
            dateHtml += `</div>`;
            listEl.innerHTML += dateHtml;
        }
    }

    // フィルタボタンのイベント
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const group = btn.getAttribute('data-group');
            if (activeGroups.has(group)) {
                activeGroups.delete(group);
                btn.classList.remove('active');
            } else {
                activeGroups.add(group);
                btn.classList.add('active');
            }
            renderEvents();
        });
    });

    init();
</script>
</body>
</html>
