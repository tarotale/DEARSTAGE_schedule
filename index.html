<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSPM SCHEDULE - MANAGER</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0a0a0f 0%, #12121e 50%, #0a0a0f 100%);
            --header-gradient: linear-gradient(180deg, #1a1a2e 0%, rgba(22, 33, 62, 0.95) 100%);
            --color-chumtoto: #FF6B9D;
            --color-2zicon: #7B61FF;
            --color-sayostay: #00C9A7;
            --color-kyurushite: #FFB800;
            --color-meme: #FF4B6E;
            --text-main: #f0f0f8;
            --text-muted: #7b7b9a;
            --color-new: #ff4b6e;
        }

        body {
            margin: 0;
            font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
        }

        header {
            background: var(--header-gradient);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 16px 20px 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .today-display { font-size: 11px; letter-spacing: 2px; color: #fff; font-weight: 700; text-transform: uppercase; border-bottom: 1px solid var(--color-2zicon); padding-bottom: 2px; }
        
        .nav-controls { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
        .current-month-title { font-size: 22px; font-weight: 700; letter-spacing: 1px; min-width: 140px; }
        
        .nav-btn {
            background: rgba(255,255,255,0.1); border: none; color: #fff;
            width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.2); }

        /* --- ヘッダー内の新着表示エリア --- */
        #newArrivalSection {
            display: none;
            background: rgba(255, 75, 110, 0.15);
            border: 1px solid rgba(255, 75, 110, 0.3);
            border-radius: 6px;
            padding: 6px 10px;
            margin-bottom: 12px;
            font-size: 11px;
            line-height: 1.5;
        }
        .new-label { color: var(--color-new); font-weight: 800; margin-right: 6px; }
        .new-detail-item { color: #fff; display: inline-block; margin-right: 8px; }
        .new-group-tag { font-size: 9px; opacity: 0.8; margin-left: 2px; }

        .filter-group { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
        .filter-btn {
            padding: 3px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15);
            background: transparent; color: #777; font-size: 11px; cursor: pointer; transition: all 0.2s;
        }
        .filter-btn.active[data-group="ChumToto"] { border-color: var(--color-chumtoto); background: color-mix(in srgb, var(--color-chumtoto), transparent 85%); color: var(--color-chumtoto); font-weight: 600; }
        .filter-btn.active[data-group="虹コン"] { border-color: var(--color-2zicon); background: color-mix(in srgb, var(--color-2zicon), transparent 85%); color: var(--color-2zicon); font-weight: 600; }
        .filter-btn.active[data-group="さよステ"] { border-color: var(--color-sayostay); background: color-mix(in srgb, var(--color-sayostay), transparent 85%); color: var(--color-sayostay); font-weight: 600; }
        .filter-btn.active[data-group="きゅるして"] { border-color: var(--color-kyurushite); background: color-mix(in srgb, var(--color-kyurushite), transparent 85%); color: var(--color-kyurushite); font-weight: 600; }
        .filter-btn.active[data-group="meme"] { border-color: var(--color-meme); background: color-mix(in srgb, var(--color-meme), transparent 85%); color: var(--color-meme); font-weight: 600; }

        .view-toggle { display: flex; gap: 4px; }
        .toggle-btn {
            padding: 4px 12px; border-radius: 6px; border: none; background: transparent;
            color: #666; font-size: 11px; cursor: pointer;
        }
        .toggle-btn.active { background: rgba(255,255,255,0.15); color: #fff; }

        .content { padding: 16px 16px 40px; max-width: 800px; margin: 0 auto; }

        /* リスト・カレンダーの共通スタイル */
        .date-section { margin-bottom: 24px; scroll-margin-top: 200px; }
        .date-header { font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #a0a0c0; border-left: 3px solid #3a3a5c; padding-left: 10px; margin-bottom: 8px; }
        .date-header.today { color: #fff; border-left-color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.5); }
        .event-card { border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; text-decoration: none; display: block; transition: transform 0.2s; border-left: 3px solid transparent; position: relative; }
        .event-card:hover { transform: translateX(4px); }
        .group-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; margin-bottom: 3px; display: flex; align-items: center; }
        
        .new-badge {
            background: var(--color-new); color: #fff; font-size: 9px; padding: 1px 5px; border-radius: 4px; margin-left: 6px;
            animation: pulse-red 2.5s infinite;
        }
        @keyframes pulse-red { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .event-title { font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 5px; color: #fff; }
        .event-info { font-size: 11px; color: #999; margin-top: 2px; }

        /* 各グループカラー設定 */
        .card-ChumToto { background: linear-gradient(135deg, rgba(255,107,157,0.1) 0%, rgba(255,255,255,0.02) 100%); border: 1px solid rgba(255,107,157,0.25); border-left-color: var(--color-chumtoto); }
        .card-ChumToto .group-label { color: var(--color-chumtoto); }
        .card-虹コン { background: linear-gradient(135deg, rgba(123,97,255,0.1) 0%, rgba(255,255,255,0.02) 100%); border: 1px solid rgba(123,97,255,0.25); border-left-color: var(--color-2zicon); }
        .card-虹コン .group-label { color: var(--color-2zicon); }
        .card-さよステ { background: linear-gradient(135deg, rgba(0,201,167,0.1) 0%, rgba(255,255,255,0.02) 100%); border: 1px solid rgba(0,201,167,0.25); border-left-color: var(--color-sayostay); }
        .card-さよステ .group-label { color: var(--color-sayostay); }
        .card-きゅるして { background: linear-gradient(135deg, rgba(255,184,0,0.1) 0%, rgba(255,255,255,0.02) 100%); border: 1px solid rgba(255,184,0,0.25); border-left-color: var(--color-kyurushite); }
        .card-きゅるして .group-label { color: var(--color-kyurushite); }
        .card-meme { background: linear-gradient(135deg, rgba(255,75,110,0.1) 0%, rgba(255,255,255,0.02) 100%); border: 1px solid rgba(255,75,110,0.25); border-left-color: var(--color-meme); }
        .card-meme .group-label { color: var(--color-meme); }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 20px; }
        .calendar-weekday { text-align: center; font-size: 10px; color: #888; padding: 6px 0; font-weight: 600; }
        .calendar-day { min-height: 52px; border-radius: 6px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.04); padding: 4px; cursor: pointer; position: relative; }
        .calendar-day.empty { background: transparent; cursor: default; border: none; }
        .calendar-day.selected { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); }
        .calendar-day.is-today { border: 1.5px solid rgba(255,255,255,0.4); }
        .day-num { font-size: 11px; color: #ccc; text-align: center; margin-bottom: 4px; }
        .dot-container { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; }
        .dot { width: 5px; height: 5px; border-radius: 50%; }

        #selected-day-events { margin-top: 20px; padding: 14px; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="today-display" id="todayLabel">--- --, ----</div>
        <div class="view-toggle">
            <button class="toggle-btn active" id="listToggle">リスト</button>
            <button class="toggle-btn" id="calendarToggle">カレンダー</button>
        </div>
    </div>
    
    <div class="nav-controls">
        <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
        <div class="current-month-title" id="currentMonthTitle">----年 --月</div>
        <button class="nav-btn" onclick="changeMonth(1)">▶</button>
    </div>

    <div id="newArrivalSection">
        <span class="new-label">NEW ARRIVAL</span>
        <span id="newArrivalContent"></span>
    </div>

    <div class="filter-group" id="filterGroup">
        <button class="filter-btn active" data-group="ChumToto">チャムトト</button>
        <button class="filter-btn active" data-group="虹コン">虹コン</button>
        <button class="filter-btn active" data-group="さよステ">さよステ</button>
        <button class="filter-btn active" data-group="きゅるして">きゅるして</button>
        <button class="filter-btn active" data-group="meme">ミーム</button>
    </div>
</header>

<div class="content" id="mainDisplay"></div>

<script>
    let allEvents = [];
    let viewMode = "list";
    let selectedDate = null;
    const now = new Date();
    let displayDate = new Date(now.getFullYear(), now.getMonth(), 1);
    const activeGroups = new Set(["ChumToto", "虹コン", "さよステ", "きゅるして", "meme"]);
    const dayNames = ["日", "月", "火", "水", "木", "金", "土"];
    const monthNamesEn = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
    const groupColors = { ChumToto: "#FF6B9D", "虹コン": "#7B61FF", "さよステ": "#00C9A7", "きゅるして": "#FFB800", meme: "#FF4B6E" };

    const getTodayStr = () => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    function updateTodayLabel() {
        const d = new Date();
        document.getElementById('todayLabel').innerText = `${monthNamesEn[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
    }

    async function init() {
        updateTodayLabel();
        const response = await fetch('./data.json?v=' + new Date().getTime());
        allEvents = await response.json();
        updateHeader();
        render(true);
    }

    function changeMonth(delta) {
        displayDate.setMonth(displayDate.getMonth() + delta);
        selectedDate = null;
        updateHeader();
        render(true);
    }

    function updateHeader() {
        const y = displayDate.getFullYear();
        const m = displayDate.getMonth();
        document.getElementById('currentMonthTitle').innerText = `${y}年 ${m + 1}月`;
    }

    function render(shouldScroll = false) {
        const display = document.getElementById('mainDisplay');
        display.innerHTML = "";
        const y = displayDate.getFullYear();
        const m = displayDate.getMonth();
        
        // --- 新着データの抽出とサマリー作成 ---
        const twentyFourHoursAgo = new Date(new Date().getTime() - (24 * 60 * 60 * 1000));
        const newEventsSummary = {}; // { "05/14": Set(["虹コン", "ChumToto"]) }
        let totalNewCount = 0;

        allEvents.forEach(ev => {
            if (ev.added_at && new Date(ev.added_at) > twentyFourHoursAgo) {
                const group = getGroupKey(ev.title);
                if (activeGroups.has(group)) {
                    totalNewCount++;
                    const d = new Date(ev.start);
                    const dateKey = `${d.getMonth()+1}/${d.getDate()}`;
                    if (!newEventsSummary[dateKey]) newEventsSummary[dateKey] = new Set();
                    newEventsSummary[dateKey].add(group);
                }
            }
        });

        // ヘッダーの新着表示を更新
        const banner = document.getElementById('newArrivalSection');
        const content = document.getElementById('newArrivalContent');
        if (totalNewCount > 0) {
            banner.style.display = 'block';
            content.innerHTML = Object.keys(newEventsSummary)
                .sort((a,b) => a.localeCompare(b))
                .map(date => {
                    const groups = Array.from(newEventsSummary[date]).join(', ');
                    return `<span class="new-detail-item">${date}<span class="new-group-tag">(${groups})</span></span>`;
                }).join('');
        } else {
            banner.style.display = 'none';
        }

        // 月次フィルタ
        const filtered = allEvents.filter(ev => {
            const evDate = new Date(ev.start);
            const isSameMonth = evDate.getFullYear() === y && evDate.getMonth() === m;
            const groupMatch = activeGroups.has(getGroupKey(ev.title));
            return isSameMonth && groupMatch;
        });

        if (viewMode === "list") {
            renderList(filtered, display, shouldScroll);
        } else {
            renderCalendar(filtered, display);
        }
    }

    function renderList(events, container, shouldScroll) {
        const grouped = {};
        events.sort((a,b) => a.start.localeCompare(b.start)).forEach(ev => {
            if(!grouped[ev.start]) grouped[ev.start] = [];
            grouped[ev.start].push(ev);
        });

        const todayStr = getTodayStr();
        let closestDate = null;

        if (Object.keys(grouped).length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#555; margin-top:60px;">この月の予定はありません</div>';
            return;
        }

        for (const date in grouped) {
            const d = new Date(date);
            const isToday = (date === todayStr);
            if (!closestDate && date >= todayStr) closestDate = date;

            container.innerHTML += `
                <div class="date-section" id="date-${date}">
                    <div class="date-header ${isToday ? 'today' : ''}">${d.getMonth()+1}/${d.getDate()}（${dayNames[d.getDay()]}）${isToday ? ' [TODAY]' : ''}</div>
                    ${grouped[date].map(ev => createEventCard(ev)).join('')}
                </div>
            `;
        }

        if (shouldScroll && closestDate) {
            setTimeout(() => {
                const target = document.getElementById(`date-${closestDate}`);
                if (target) {
                    const headerHeight = document.querySelector('header').offsetHeight;
                    window.scrollTo({ top: target.offsetTop - headerHeight - 20, behavior: 'smooth' });
                }
            }, 100);
        }
    }

    function renderCalendar(events, container) {
        const y = displayDate.getFullYear();
        const m = displayDate.getMonth();
        const firstDay = new Date(y, m, 1).getDay();
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const todayStr = getTodayStr();
        
        let html = '<div class="calendar-grid">';
        dayNames.forEach((d, i) => html += `<div class="calendar-weekday" style="color:${i==0?'#ff6b6b':i==6?'#6ba3ff':''}">${d}</div>`);
        for(let i=0; i<firstDay; i++) html += '<div class="calendar-day empty"></div>';
        
        for(let d=1; d<=daysInMonth; d++) {
            const dateKey = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const dayEvents = events.filter(e => e.start === dateKey);
            const isToday = (dateKey === todayStr);
            const uniqueGroups = [...new Set(dayEvents.map(e => getGroupKey(e.title)))];
            
            html += `
                <div class="calendar-day ${selectedDate === dateKey?'selected':''} ${isToday?'is-today':''}" onclick="selectDate('${dateKey}')">
                    <div class="day-num">${d}</div>
                    <div class="dot-container">
                        ${uniqueGroups.map(g => `<div class="dot" style="background:${groupColors[g]}"></div>`).join('')}
                    </div>
                </div>
            `;
        }
        html += '</div><div id="selected-day-events"></div>';
        container.innerHTML = html;
        if(selectedDate) renderSelectedDay(events);
    }

    function selectDate(date) {
        selectedDate = (selectedDate === date) ? null : date;
        render(false);
    }

    function renderSelectedDay(events) {
        const dayEvents = events.filter(e => e.start === selectedDate);
        const container = document.getElementById('selected-day-events');
        if(!dayEvents.length) { container.innerHTML = ""; return; }
        const d = new Date(selectedDate);
        container.innerHTML = `
            <div class="date-header" style="margin-bottom:12px">${d.getMonth()+1}/${d.getDate()}（${dayNames[d.getDay()]}）</div>
            ${dayEvents.map(ev => createEventCard(ev)).join('')}
        `;
    }

    function getGroupKey(title) {
        if(title.includes("ChumToto")) return "ChumToto";
        if(title.includes("虹コン")) return "虹コン";
        if(title.includes("さよステ")) return "さよステ";
        if(title.includes("きゅるして")) return "きゅるして";
        return "meme";
    }

    function createEventCard(ev) {
        const gKey = getGroupKey(ev.title);
        const displayTitle = ev.title.replace(/\[.*?\]\s*/, '');
        const timeInfo = ev.time ? `<div class="event-info">⏰ ${ev.time}</div>` : '';
        const venueInfo = `<div class="event-info">📍 ${ev.venue || '詳細を確認'}</div>`;
        
        const twentyFourHoursAgo = new Date(new Date().getTime() - (24 * 60 * 60 * 1000));
        const isNew = ev.added_at && new Date(ev.added_at) > twentyFourHoursAgo;
        const newBadge = isNew ? `<span class="new-badge">NEW</span>` : '';

        return `
            <a href="${ev.url}" class="event-card card-${gKey}" target="_blank">
                <div class="group-label">${gKey.toUpperCase()} ${newBadge}</div>
                <div class="event-title">${displayTitle}</div>
                ${timeInfo}
                ${venueInfo}
            </a>
        `;
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const g = btn.dataset.group;
            activeGroups.has(g) ? activeGroups.delete(g) : activeGroups.add(g);
            btn.classList.toggle('active');
            render(false);
        });
    });

    document.getElementById('listToggle').addEventListener('click', () => {
        viewMode = "list";
        document.getElementById('listToggle').classList.add('active');
        document.getElementById('calendarToggle').classList.remove('active');
        render(true);
    });

    document.getElementById('calendarToggle').addEventListener('click', () => {
        viewMode = "calendar";
        document.getElementById('calendarToggle').classList.add('active');
        document.getElementById('listToggle').classList.remove('active');
        render(false);
    });

    init();
</script>
</body>
</html>
